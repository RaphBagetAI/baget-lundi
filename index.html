<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lundi - The Parisian Executive Protocol</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #0A0E1A;
      color: #F0F0F0;
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
    }

    h1, h2, h3 {
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.1;
      margin: 0;
      color: #00D4FF;
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    p {
      color: #C9D1D9;
      font-size: 1rem;
      max-width: 520px;
      margin-bottom: 1.25rem;
    }

    a {
      color: #00D4FF;
      text-decoration: none;
    }

    a:hover,
    a:focus {
      text-decoration: underline;
    }

    .container {
      max-width: 480px;
      margin: 0 auto 60px;
      padding-top: 60px;
      text-align: center;
    }

    .btn {
      background-color: #00D4FF;
      color: #0A0E1A;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      padding: 16px 26px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,212,255,0.2);
      transition: background-color 0.2s ease, box-shadow 0.3s ease;
      width: 100%;
      max-width: 320px;
      margin: 24px auto 0;
      display: block;
    }

    .btn:hover,
    .btn:focus {
      background-color: #00b8e2;
      box-shadow: 0 0 30px rgba(0,184,226,0.4);
      outline: none;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 32px;
      align-items: center;
    }

    input, select {
      width: 100%;
      max-width: 320px;
      padding: 14px 16px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background-color: #1A2035;
      color: #F0F0F0;
      box-shadow: inset 0 0 8px rgba(0, 212, 255, 0.1);
      transition: box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #6B7280;
    }

    input:focus, select:focus {
      outline: none;
      box-shadow: inset 0 0 10px #00D4FF;
    }

    .message {
      margin-top: 20px;
      font-weight: 600;
      color: #00D4FF;
      min-height: 24px;
      text-align: center;
    }

    /* Subtle background grid pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: radial-gradient(#1A2035 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    /* Social proof placeholder section */
    .social-proof {
      margin-top: 48px;
      color: #717171;
      font-style: italic;
      font-size: 0.95rem;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
      border-top: 1px solid #1A2035;
      padding-top: 24px;
    }

    /* Responsive */
    @media (min-width: 600px) {
      h1 {
        font-size: 3.5rem;
      }
      h2 {
        font-size: 2.25rem;
      }
    }

  </style>
</head>
<body>
  <main class="container" role="main">
    <h1>The Parisian Executive Protocol</h1>
    <p>AI styling for the mission-ready closet. Transform your existing wardrobe into a privacy-first digital asset, optimized for high-stakes professional moments.</p>
    <form id="waitlist-form" novalidate>
      <input type="email" name="email" placeholder="Your email" required aria-label="Email address" />
      <input type="text" name="firstName" placeholder="First name" required aria-label="First name" />
      <input type="text" name="lastName" placeholder="Last name" required aria-label="Last name" />
      <input type="text" name="occupation" placeholder="Occupation" required aria-label="Occupation" />
      <button type="submit" class="btn">Join the Waitlist</button>
    </form>
    <div class="message" id="message"></div>
    <div class="social-proof">Trusted by 100+ Parisian executives preparing for the 2026 Rixain launch.</div>
  </main>
  <script>
    const form = document.getElementById('waitlist-form');
    const messageEl = document.getElementById('message');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      const formData = new FormData(form);
      const data = {
        email: formData.get('email').trim(),
        firstName: formData.get('firstName').trim(),
        lastName: formData.get('lastName').trim(),
        occupation: formData.get('occupation').trim(),
      };

      if (!data.email || !data.firstName || !data.lastName || !data.occupation) {
        messageEl.textContent = 'Please fill out all fields.';
        messageEl.style.color = '#ff4d4d';
        return;
      }

      try {
        const response = await fetch(
          'https://app.baget.ai/api/public/databases/e577228d-0c6d-4b68-a6f6-7651d63d3722/rows',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ data }),
          }
        );

        if (response.ok) {
          messageEl.textContent = 'Thank you! You have joined the waitlist.';
          messageEl.style.color = '#00D4FF';
          form.reset();
        } else {
          throw new Error('Failed to submit');
        }
      } catch (error) {
        messageEl.textContent = 'Submission failed. Please try again later.';
        messageEl.style.color = '#ff4d4d';
      }
    });
  </script>
</body>
</html>
